[package]
name    = "wifi-connect"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ameba-rt      = { path = "../../ameba-rt" }
ameba-hal     = { path = "../../ameba-hal" }
ameba-rom-sys = { path = "../../ameba-rom-sys" }
ameba-wifi    = { path = "../../ameba-wifi" }

cortex-m    = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers", "task-arena-size-32768"] }
embassy-time     = { version = "0.3", features = ["tick-hz-1_000_000"] }
embassy-net      = { version = "0.5", features = ["medium-ethernet", "proto-ipv4", "dhcpv4", "tcp"] }
static_cell      = "2.1"

[profile.release]
panic         = "abort"
lto           = false
opt-level     = "z"
codegen-units = 1
debug         = false
strip         = "none"

[profile.dev]
panic     = "abort"
opt-level = "z"
