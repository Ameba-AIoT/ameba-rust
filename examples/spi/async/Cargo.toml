[package]
name    = "spi-async"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "spi-async"
path = "src/main.rs"

[dependencies]
ameba-rt      = { path = "../../../ameba-rt" }
ameba-hal     = { path = "../../../ameba-hal" }
ameba-rom-sys = { path = "../../../ameba-rom-sys" }

cortex-m    = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time     = { version = "0.3", features = ["tick-hz-1_000_000"] }

[profile.release]
panic         = "abort"
lto           = false
opt-level     = "z"
codegen-units = 1
debug         = false
strip         = "none"

[profile.dev]
panic     = "abort"
opt-level = "z"
