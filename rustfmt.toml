# Must match the `edition` declared by the crates in this repo. This tells
# rustfmt which grammar to parse with — it does not select an edition for the
# code. Setting it also pins `style_edition` to the same value.
#
# No unstable options here: rustfmt only honours those on nightly, and on
# stable it prints a warning and silently ignores them, so a config full of
# them would look effective while doing nothing. The toolchain is rolling
# `stable` (see rust-toolchain.toml), so only stable options may be used.
edition = "2024"
